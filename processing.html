<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演算中 | Biz-Ex Super</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a2a44 0%, #0d1b2a 100%);
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        /* Background Grid */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .processing-container {
            text-align: center;
            z-index: 10;
            background: rgba(13, 27, 42, 0.8);
            padding: 60px 100px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 229, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .loader-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 40px;
        }

        .loader-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(0, 229, 255, 0.1);
            border-top: 4px solid #00e5ff;
            border-right: 4px solid transparent;
            animation: spin 2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }

        .loader-ring-mid {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            border: 2px solid rgba(0, 229, 255, 0.05);
            border-left: 3px solid #00bcd4;
            border-bottom: 3px solid transparent;
            animation: spin-reverse 2.5s linear infinite;
        }

        .loader-ring-inner {
            position: absolute;
            top: 35px;
            left: 35px;
            right: 35px;
            bottom: 35px;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-top: 2px solid #fff;
            animation: spin 3s ease-in-out infinite;
        }

        .loader-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            font-weight: 900;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            font-family: 'Consolas', monospace;
        }

        .title-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .status-text {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .sub-status {
            font-size: 1.2rem;
            color: #00e5ff;
            opacity: 0.9;
            height: 1.5em;
            font-family: 'Consolas', monospace;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 4px;
        }

        .progress-bar-container {
            width: 500px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00acc1, #00e5ff, #fff);
            background-size: 200% 100%;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            transition: width 0.1s linear;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .data-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .data-particle {
            position: absolute;
            background: #00e5ff;
            width: 1px;
            height: 40px;
            opacity: 0.2;
            animation: move-down linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            0% {
                transform: rotate(360deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.4;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.7;
            }
        }

        @keyframes move-down {
            from {
                transform: translateY(-100px);
            }

            to {
                transform: translateY(110vh);
            }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.3;
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #00e5ff;
            pointer-events: none;
        }

        .top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>
    <div class="data-stream" id="dataStream"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="processing-container">
        <div class="title-text">Execution Phase</div>
        <div class="loader-wrapper">
            <div class="loader-ring"></div>
            <div class="loader-ring-mid"></div>
            <div class="loader-ring-inner"></div>
            <div class="loader-pulse"></div>
            <div class="percentage" id="percentageText">00</div>
        </div>

        <div class="status-text" id="mainStatus">第15期 決算演算中</div>
        <div class="sub-status" id="subStatus">SYSTEM INITIALIZING...</div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <script>
        const subStatusMessages = [
            "AGGREGATING DECISION DATA...",
            "RUNNING MARKET SIMULATIONS...",
            "ANALYZING COMPETITOR STRATEGIES...",
            "RECALCULATING PRODUCTION COSTS...",
            "OPTIMIZING PERSONNEL ALLOCATION...",
            "UPDATING CASH FLOW MODELS...",
            "CALCULATING TERM 15 METRICS...",
            "GENERATING FINANCIAL REPORTS...",
            "MODELING PROJECTION DATA...",
            "FINALIZING DATA INTEGRITY..."
        ];

        let currentProgress = 0;
        const progressBar = document.getElementById('progressBar');
        const percentageText = document.getElementById('percentageText');
        const subStatus = document.getElementById('subStatus');
        const mainStatus = document.getElementById('mainStatus');

        // Create particles
        const dataStream = document.getElementById('dataStream');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'data-particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            dataStream.appendChild(particle);
        }

        function updateProgress() {
            if (currentProgress < 100) {
                let increment = Math.random() * 2;
                if (currentProgress > 40 && currentProgress < 60) increment *= 0.4;
                if (currentProgress > 85) increment *= 0.2;

                currentProgress += increment;
                if (currentProgress > 100) currentProgress = 100;

                progressBar.style.width = currentProgress + '%';
                percentageText.innerText = Math.floor(currentProgress).toString().padStart(2, '0');

                const messageIndex = Math.floor((currentProgress / 100) * subStatusMessages.length);
                if (subStatusMessages[messageIndex]) {
                    subStatus.innerText = subStatusMessages[messageIndex];
                }

                if (Math.random() > 0.95) {
                    mainStatus.style.textShadow = "2px 0 #f0f, -2px 0 #0ff";
                    setTimeout(() => { mainStatus.style.textShadow = "0 2px 10px rgba(0, 0, 0, 0.5)"; }, 50);
                }

                setTimeout(updateProgress, 40 + Math.random() * 60);
            } else {
                subStatus.innerText = "CALCULATION COMPLETE";
                subStatus.style.color = "#4caf50";
                percentageText.style.color = "#4caf50";
                mainStatus.innerText = "第15期 決算完了";

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            }
        }

        setTimeout(updateProgress, 500);
    </script>
</body>

</html>
